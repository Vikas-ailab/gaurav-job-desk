<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d2938"><meta name="description" content="Private job-search workspace for Gaurav Rathore"><link rel="manifest" href="manifest.webmanifest"><title>Gaurav Job Desk</title>
<style>:root{color-scheme:light;--ink:#202832;--muted:#77818a;--line:#e8e2d8;--paper:#f3f0e9;--navy:#1d2938;--navy2:#29394b;--gold:#b18b55;--gold-soft:#f3eadb;--sage:#e8eee9;--amber:#f7efdf;--red:#f8e9e6;--shadow:0 14px 36px rgba(31,39,48,.075)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e8e2d7 0,transparent 38%),radial-gradient(ellipse at 100% 18%,#e7e9e5 0,transparent 30%),var(--paper);color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:transform .16s ease,background .16s ease,box-shadow .16s ease}button:active{transform:scale(.98)}.shell{max-width:1440px;margin:auto;padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:25px;padding:15px 18px;background:rgba(255,255,255,.88);border:1px solid rgba(226,219,207,.95);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#34485d,#182433);color:#f3e7d3;display:grid;place-items:center;font-weight:850;letter-spacing:-1px;box-shadow:0 7px 16px rgba(29,41,56,.22)}.brand h1{font-size:19px;letter-spacing:-.45px;margin:0}.sub{font-size:12px;color:var(--muted)}.pill{border-radius:99px;padding:7px 12px;background:var(--gold-soft);color:#765a32;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:228px minmax(0,1fr);gap:25px;align-items:start}.nav{display:flex;flex-direction:column;gap:6px;padding:12px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);position:sticky;top:16px}.nav button{border:0;text-align:left;background:transparent;padding:12px 14px;border-radius:12px;color:#68727c;font-size:13px;font-weight:620}.nav button.active,.nav button:hover{background:linear-gradient(100deg,#e9e4da,#f5f1e9);color:var(--navy);font-weight:760}.main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:5px 0 20px}.heading h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.9px;color:#202a36}.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:12px;padding:10px 15px;background:linear-gradient(135deg,#34485d,#1d2938);color:#fff;font-weight:700;box-shadow:0 5px 12px rgba(29,41,56,.15)}.btn:hover{box-shadow:0 8px 18px rgba(29,41,56,.22);transform:translateY(-1px)}.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:none}.btn.danger{background:#a53b31}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 5px 18px rgba(31,39,48,.04)}.stat{font-size:32px;font-weight:820;letter-spacing:-1.3px;color:var(--navy)}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.job{border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0;background:#fff;box-shadow:0 5px 17px rgba(31,39,48,.04)}.job h3{margin:0 0 4px;font-size:16px;letter-spacing:-.2px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{font-size:11px;padding:5px 9px;border-radius:99px;background:#f3f1ec;color:#59636c;border:1px solid #ebe6dd}.score{font-weight:820;color:#72552d;background:var(--gold-soft);padding:5px 9px;border-radius:10px}label{display:block;font-size:12px;font-weight:720;color:#46515c;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #dfd9cf;border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{border-color:#b18b55;box-shadow:0 0 0 3px rgba(177,139,85,.14)}textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.notice{padding:13px 15px;border-radius:14px;background:var(--amber);border:1px solid #eadcc2;font-size:13px;margin:13px 0;color:#665638}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ded8ce;border-radius:16px}.hidden{display:none!important}.tabs{display:none}footer{margin:28px 0 8px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:900px){.shell{padding:16px}.layout{grid-template-columns:1fr;gap:14px}.nav{position:static;display:flex;flex-direction:row;overflow-x:auto;gap:5px;padding:7px;border-radius:15px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{margin-bottom:15px}}@media(max-width:560px){.shell{padding:10px}.top{padding:12px;border-radius:16px}.logo{width:40px;height:40px;border-radius:13px}.brand h1{font-size:16px}.sub{font-size:11px}.pill{display:none}.nav{margin:0 -1px 13px}.nav button{font-size:12px;padding:9px 11px}.heading{margin:7px 2px 15px}.heading h2{font-size:23px}.heading p{font-size:12px}.grid{gap:9px}.card{padding:14px;border-radius:15px}.stat{font-size:27px}.job{padding:14px;border-radius:15px}.formgrid{grid-template-columns:1fr}.btn{padding:10px 12px;font-size:13px}input,select,textarea{font-size:16px}footer{padding-bottom:12px}}</style></head><body><div class="shell">
<header class="top"><div class="brand"><div class="logo">GJ</div><div><h1>Gaurav Job Desk</h1><div class="sub">Private job search workspace</div></div></div><span class="pill">Approval mode · No auto-apply</span></header>
<div class="layout"><nav class="nav" id="nav">
<button data-page="dashboard" class="active">Overview</button><button data-page="jobs">Job shortlist</button><button data-page="add">Add a job</button><button data-page="cv">CV Studio</button><button data-page="tracker">Application tracker</button><button data-page="profile">Profile & settings</button>
</nav><main class="main" id="main"></main></div>
<footer>Private job workspace · Daily vacancy history · Secure account sync available</footer></div>
<script>
const PROFILE={name:"Gaurav Rathore",email:"",phone:"",location:"Bengaluru, Karnataka, India",headline:"VoIP, VICIdial & Softswitch Specialist | CCaaS Implementation Lead",summary:"16+ years in international voice operations, VoIP infrastructure and dialer administration. Experienced in multi-server VICIdial deployments, softswitch administration, SIP/RTP troubleshooting, cloud-hosted telephony and operations leadership.",skills:["VICIdial multi-server clusters","ViciBox","ViciPhone WebRTC","SSL/TLS","WSS","STUN/NAT","MariaDB","GoAutoDial","VOS3000","ASTPP","MagnusBilling","FreeSWITCH","Asterisk","FreePBX","SIP trunking","SIP/RTP troubleshooting","G.711/G.729","iptables","Fail2ban","IP whitelisting","AWS EC2/VPC","Oracle Cloud","Linux VPS","CRM webhooks","REST API","predictive/progressive pacing","CLI rotation","ACD/IVR","SLA","AHT","occupancy","QA","RPC","WBRs","CRTC compliance"],experience:"Independent VoIP Infrastructure & Dialer Consultant (2018–Present)\nOperations & Telephony Manager, Canadian outbound telecom campaign (5 years)\nOperations Manager, Oasis BPO Services (2013–2018) — led 50+ agents and team leaders\nInternational Voice Executive, International Voice BPO (2010–2013)",education:"BCA, CBS Education Group, Agra (2008)",availability:"Immediate joiner"};
const KEY=["vicidial","voip","telephony","softswitch","ccaas","asterisk","freeswitch","sip","dialer","vici","voice","implementation","contact center","contact centre","technical operations"];
let jobs=JSON.parse(localStorage.getItem("gj_jobs")||"[]"),tracker=JSON.parse(localStorage.getItem("gj_tracker")||"[]"),page="dashboard";
const save=()=>{localStorage.setItem("gj_jobs",JSON.stringify(jobs));localStorage.setItem("gj_tracker",JSON.stringify(tracker))};
window.__gjSetCloudData=(d)=>{jobs=d.jobs||[];tracker=d.tracker||[];localStorage.setItem("gj_jobs",JSON.stringify(jobs));localStorage.setItem("gj_tracker",JSON.stringify(tracker));render()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function score(j){let text=(j.title+" "+j.company+" "+j.description+" "+j.skills).toLowerCase(),hits=PROFILE.skills.filter(s=>text.includes(s.toLowerCase())).length,role=KEY.some(k=>text.includes(k))?1:0,sen=/lead|manager|head|senior|specialist|architect/i.test(j.title)?1:.5,loc=/bengaluru|bangalore/i.test(j.location)?1:(/remote/i.test(j.location)&&/india/i.test(j.location)?1:0);let raw=Math.min(30,hits/Math.max(5,PROFILE.skills.length)*180)+20*(role?1:.25)+15*sen+15*(role?1:0)+10*loc+10*(/team|lead|manage|operations/i.test(text)?1:.3);return Math.round(raw)}
function fitGate(j){let t=(j.title+" "+j.description+" "+j.skills).toLowerCase();return KEY.some(k=>t.includes(k))}
function heading(title,desc,action=""){return '<div class="heading"><div><h2>'+title+'</h2><p>'+desc+'</p></div>'+action+'</div>'}
function jobCard(j,i){let s=score(j);return '<article class="job"><div class="row"><div><h3>'+esc(j.title)+'</h3><div class="muted">'+esc(j.company)+' · '+esc(j.location)+'</div></div><div class="score">'+s+'/100</div></div><div class="tags"><span class="tag">'+esc(j.type||"Not specified")+'</span><span class="tag">'+esc(j.source||"Manual entry")+'</span><span class="tag">'+esc(j.posted||"Posting date unknown")+'</span></div><p class="small">'+esc((j.description||"No description supplied").slice(0,260))+'</p><div class="small muted">Fit gate: '+(fitGate(j)?"Relevant keywords detected":"Not enough role keywords")+' · Verify vacancy and requirements on employer site.</div><div class="actions"><button class="btn secondary" onclick="viewJob('+i+')">Details</button><button class="btn" onclick="trackJob('+i+')">Add to tracker</button>'+(j.url?'<a class="btn secondary" href="'+esc(j.url)+'" target="_blank" rel="noopener">Open listing ↗</a>':"")+'</div></article>'}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let m=document.getElementById("main");
if(page==="dashboard"){let approved=tracker.filter(x=>x.status==="Applied").length;m.innerHTML=heading("Good to see you, Gaurav","Your search workspace at a glance",'<button class="btn" onclick="go(\'add\')">＋ Add a job</button>')+'<div class="grid"><div class="card"><div class="muted small">Saved opportunities</div><div class="stat">'+jobs.length+'</div></div><div class="card"><div class="muted small">Tracked applications</div><div class="stat">'+tracker.length+'</div></div><div class="card"><div class="muted small">Marked applied</div><div class="stat">'+approved+'</div></div></div><div class="notice"><b>Important:</b> No live job-board connector is active. This version does not automatically discover or verify vacancies and does not run a 15-minute refresh. Add roles manually and verify each vacancy on the employer’s official careers page.</div><div class="card"><div class="row"><b>Target profile</b><span class="tag">Immediate joiner</span></div><p>'+esc(PROFILE.headline)+'</p><div class="muted small">Bengaluru office/hybrid/remote · Outside Bengaluru: fully remote India roles only</div></div><div class="card"><b>Recent shortlist</b>'+(jobs.length?jobs.slice(-3).reverse().map((j)=>jobCard(j,jobs.indexOf(j))).join(""):'<div class="empty">No roles saved yet. Add a verified job to begin.</div>')+'</div>'}
if(page==="jobs"){m.innerHTML=heading("Job shortlist","Review roles you have added. Scores are preliminary keyword-based estimates.")+(jobs.length?jobs.slice().reverse().map((j)=>jobCard(j,jobs.indexOf(j))).join(""):'<div class="card empty">No jobs saved yet. Add a role from a company careers page.</div>')}
if(page==="add"){m.innerHTML=heading("Add a job","Paste a real vacancy and its description. The score is indicative, not a hiring prediction.")+'<div class="card"><form id="jobform"><div class="formgrid"><div><label>Job title *</label><input name="title" required placeholder="e.g. VoIP Operations Manager"></div><div><label>Company *</label><input name="company" required></div><div><label>Location *</label><input name="location" required placeholder="Bengaluru / Remote, India"></div><div><label>Work mode</label><select name="type"><option>Office</option><option>Hybrid</option><option>Remote</option></select></div><div><label>Posting date</label><input name="posted" type="date"></div><div><label>Source</label><input name="source" placeholder="Company careers page"></div></div><label>Vacancy URL</label><input name="url" type="url" placeholder="https://..."><label>Key skills (optional)</label><input name="skills" placeholder="SIP, VICIdial, CCaaS..."><label>Job description *</label><textarea name="description" required placeholder="Paste the job requirements and responsibilities"></textarea><div class="actions"><button class="btn" type="submit">Save and score role</button></div></form></div>'}
if(page==="cv"){m.innerHTML=heading("CV Studio","Edit a truthful base CV and generate a role-focused draft from saved vacancies.")+'<div class="notice">This is a reusable base profile, not a role-tailored CV. Compare every edit against the actual job requirements; do not add unverified achievements.</div><div class="card"><label>Professional headline</label><input id="cvhead" value="'+esc(PROFILE.headline)+'"><label>Professional summary</label><textarea id="cvsummary">'+esc(PROFILE.summary)+'</textarea><label>Experience</label><textarea id="cvexp">'+esc(PROFILE.experience)+'</textarea><label>Skills</label><textarea id="cvskills">'+esc(PROFILE.skills.join(", "))+'</textarea><label>Education</label><input id="cvedu" value="'+esc(PROFILE.education)+'"><div class="actions"><button class="btn" onclick="downloadCV()">Download CV as text (no contact details)</button><button class="btn secondary" onclick="resetCV()">Reset to profile</button></div></div>'}
if(page==="tracker"){m.innerHTML=heading("Application tracker","Track progress manually. This app will not submit applications.")+(tracker.length?tracker.map((t,i)=>'<div class="job"><div class="row"><div><b>'+esc(t.title)+'</b><div class="muted small">'+esc(t.company)+'</div></div><select onchange="setStatus('+i+',this.value)">'+["Saved","Applied","Recruiter screen","Interview","Offer","Rejected","No response"].map(s=>'<option '+(t.status===s?'selected':'')+'>'+s+'</option>').join("")+'</select></div><div class="small muted">Added '+esc(t.date)+'</div><label>Notes</label><textarea onchange="setNote('+i+',this.value)">'+esc(t.note||"")+'</textarea><div class="actions"><button class="btn secondary" onclick="removeTrack('+i+')">Remove</button></div></div>').join(""):'<div class="card empty">No applications tracked yet. Save a job to start tracking it.</div>')}
if(page==="profile"){m.innerHTML=heading("Profile & settings","Review the candidate profile and local data controls.")+'<div class="card"><h3>'+esc(PROFILE.name)+'</h3><p>'+esc(PROFILE.headline)+'</p><p class="muted">'+esc(PROFILE.location)+' · '+esc(PROFILE.availability)+'</p><p>'+esc(PROFILE.email)+' · '+esc(PROFILE.phone)+'</p><b>Core skills</b><div class="tags">'+PROFILE.skills.map(s=>'<span class="tag">'+esc(s)+'</span>').join("")+'</div><h3>Experience</h3><p style="white-space:pre-line">'+esc(PROFILE.experience)+'</p><p><b>Education:</b> '+esc(PROFILE.education)+'</p></div><div class="card"><b>Data & privacy</b><p class="muted small">Jobs and tracker notes are stored in local storage on this device. They are not synced to another device or account.</p><button class="btn danger" onclick="clearData()">Erase all locally saved jobs and tracker data</button></div>'}
}
function go(p){page=p;render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(!b)return;e.preventDefault();e.stopImmediatePropagation();go(b.dataset.page)},true);
document.addEventListener("submit",e=>{if(e.target.id!=="jobform")return;e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let j={...d,created:new Date().toISOString()};if(j.type==="Remote"&&!/bengaluru|bangalore/i.test(j.location)&&!/india/i.test(j.location)){alert("Location rule: remote roles outside Bengaluru must explicitly be remote in India.");return}if((j.type==="Office"||j.type==="Hybrid")&&!/bengaluru|bangalore/i.test(j.location)){alert("Location rule: office and hybrid roles must be in Bengaluru.");return}jobs.push(j);save();alert("Role saved. Indicative score: "+score(j)+"/100. Please verify the listing and must-have skills.");go("jobs")});
function viewJob(i){let j=jobs[i];alert(j.title+"\n"+j.company+"\nIndicative fit: "+score(j)+"/100\nMust-have keyword gate: "+(fitGate(j)?"Passed":"Not passed")+".\n\nThis is not a verified vacancy or a complete skills assessment. Review the employer listing manually.\n\n"+j.description)}
function trackJob(i){let j=jobs[i],jobId=j.id||j.url||((j.company||"")+"|"+(j.title||""));if(tracker.some(t=>(t.jobId||t.id||t.url||((t.company||"")+"|"+(t.title||"")))==jobId)){alert("This role is already in your tracker.");return}tracker.push({jobId,title:j.title,company:j.company,url:j.url||"",description:j.description||"",status:"Saved",date:new Date().toLocaleDateString(),note:""});save();alert("Added to tracker. No application was submitted.");go("tracker")}
function setStatus(i,v){tracker[i].status=v;if(v==="Applied"){tracker[i].appliedAt=new Date().toISOString()}save()}function setNote(i,v){tracker[i].note=v;save()}function removeTrack(i){tracker.splice(i,1);save();render()}
function downloadCV(){let txt=PROFILE.name+"\n"+PROFILE.email+" | "+PROFILE.phone+" | "+PROFILE.location+"\n\n"+document.getElementById("cvhead").value+"\n\nPROFESSIONAL SUMMARY\n"+document.getElementById("cvsummary").value+"\n\nEXPERIENCE\n"+document.getElementById("cvexp").value+"\n\nSKILLS\n"+document.getElementById("cvskills").value+"\n\nEDUCATION\n"+document.getElementById("cvedu").value;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));a.download="Gaurav_Rathore_CV.txt";a.click();URL.revokeObjectURL(a.href)}
function resetCV(){render()}function clearData(){if(confirm("Permanently erase locally saved jobs and tracker entries on this device?")){jobs=[];tracker=[];save();render()}}
render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./enhancements.js"></script></body></html>
